<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi espacio de estudio</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#12263a;--mut:#5b6b7c;--line:#dbe3eb;--acc:#0f766e;--acc2:#e8f5f3;--hot:#f59e0b;--bad:#dc2626;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1620;--card:#162331;--ink:#e8eef4;--mut:#93a4b5;--line:#25384a;--acc:#2dd4bf;--acc2:#12312f;--hot:#fbbf24;--bad:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Inter,sans-serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.hidden{display:none!important}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:.6rem 1.1rem;font-weight:600}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn{color:#06201d}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:.3rem .7rem;font-size:.85rem}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;width:100%}
label{font-size:.85rem;font-weight:600;color:var(--mut);display:block;margin-bottom:.25rem}
/* registro */
#reg{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.regbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2rem;width:100%;max-width:420px;display:grid;gap:1rem}
.regbox h1{font-size:2rem;line-height:1.1}
.regbox p{margin:0;color:var(--mut)}
/* cabecera */
header{background:var(--acc);color:#fff;padding:1.4rem 1.2rem 1rem}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) header{background:#0b2a2d;color:#e8eef4}}
.hwrap{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
#uname{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;line-height:1.05;word-break:break-word}
#uschool{font-size:.9rem;opacity:.85;margin-top:.2rem}
.hbtn{display:flex;gap:.5rem;flex-wrap:wrap}
.hbtn .btn{background:rgba(255,255,255,.16);color:inherit}
nav{max-width:1000px;margin:1rem auto 0;display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem}
nav button{background:transparent;border:0;color:inherit;opacity:.8;padding:.5rem .9rem;border-radius:999px;white-space:nowrap;font-weight:500}
nav button.on{background:var(--card);color:var(--ink);opacity:1;font-weight:600}
main{max-width:1000px;margin:1.2rem auto;padding:0 1rem 3rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 140px}
.row>.btn{flex:0 0 auto}
.big{font-family:'Bricolage Grotesque';font-size:2.4rem;font-weight:800;line-height:1}
.mut{color:var(--mut);font-size:.9rem}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:.5rem 0}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.item{display:flex;align-items:center;gap:.7rem;padding:.65rem 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .t{flex:1;min-width:0}
.item.done .t b{text-decoration:line-through;color:var(--mut)}
.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.tag{font-size:.75rem;padding:.1rem .5rem;border-radius:99px;background:var(--acc2);color:var(--acc);font-weight:600}
.tag.alta{background:#fee2e2;color:#b91c1c}.tag.media{background:#fef3c7;color:#92400e}
.x{background:none;border:0;color:var(--mut);font-size:1.2rem}
.x:hover{color:var(--bad)}
h2{font-size:1.5rem;margin-bottom:.8rem}
h3{font-size:1.1rem;margin-bottom:.6rem}
.stack{display:grid;gap:1rem}
/* horario */
.hor{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
th,td{border:1px solid var(--line);padding:2px}
th{font-size:.85rem;padding:.4rem;background:var(--acc2);color:var(--acc)}
td input{border:0;border-radius:6px;padding:.4rem;font-size:.85rem;background:transparent}
td.h{font-size:.8rem;color:var(--mut);text-align:center;width:60px}
/* notas */
.notes{display:grid;grid-template-columns:240px 1fr;gap:1rem}
@media(max-width:700px){.notes{grid-template-columns:1fr}}
.nl button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:.6rem .4rem}
.nl button.on{background:var(--acc2);font-weight:600}
textarea{min-height:320px;resize:vertical}
/* tarjetas */
.flip{min-height:200px;display:grid;place-items:center;text-align:center;font-size:1.3rem;font-family:'Bricolage Grotesque';padding:1.5rem;cursor:pointer;background:var(--acc2);border:2px dashed var(--acc);border-radius:16px}
/* pomodoro */
.time{font-family:'Bricolage Grotesque';font-weight:800;font-size:clamp(4rem,16vw,7rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.center{display:flex;justify-content:center;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:10px;z-index:9}
:root[data-theme=dark]{--bg:#0e1620;--card:#162331;--ink:#e8eef4;--mut:#93a4b5;--line:#25384a;--acc:#2dd4bf;--acc2:#12312f;--hot:#fbbf24;--bad:#f87171;color-scheme:dark}
:root[data-theme=dark] header{background:#0b2a2d;color:#e8eef4}
:root[data-theme=dark] .btn{color:#06201d}
:root:root .btn.ghost{color:var(--ink)}
:root:root .hbtn .btn{color:inherit}
header{background-image:linear-gradient(135deg,rgba(255,255,255,.14),transparent 60%)}
.card{transition:transform .2s,box-shadow .2s}.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.1);transform:translateY(-2px)}
.quote{margin:0 0 1rem;padding:.9rem 1.1rem;border-left:4px solid var(--hot);background:var(--card);border-radius:0 12px 12px 0;font-style:italic}
.chart{display:flex;align-items:flex-end;gap:.5rem;height:100px}
.chart div{flex:1;text-align:center;font-size:.75rem;color:var(--mut)}
.chart i{display:block;background:var(--acc);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:3px}
.fx{position:fixed;top:-2.5rem;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="reg" class="hidden">
  <form class="regbox" id="regForm">
    <h1>Empieza a estudiar mejor</h1>
    <p>Dinos cómo te llamas. Todo se guarda en este dispositivo, sin cuentas.</p>
    <div><label for="rn">Tu nombre</label><input id="rn" required maxlength="40" autocomplete="given-name"></div>
    <div><label for="rs">Tu colegio o instituto</label><input id="rs" required maxlength="60"></div>
    <button class="btn" type="submit">Entrar</button>
  </form>
</section>

<section id="app" class="hidden">
  <header>
    <div class="hwrap">
      <div><div id="uname"></div><div id="uschool"></div></div>
      <div class="hbtn">
        <button class="btn sm" id="bTh">Tema</button>
        <button class="btn sm" id="bExp">Guardar copia</button>
        <button class="btn sm" id="bImp">Cargar copia</button>
        <button class="btn sm" id="bOut">Cambiar perfil</button>
        <input type="file" id="fImp" accept=".json" class="hidden">
      </div>
    </div>
    <nav id="nav"></nav>
  </header>
  <main id="view"></main>
</section>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='estudio_v1';
const blank=()=>({user:null,tasks:[],exams:[],notes:[],cards:[],sched:{},pomo:{}});
let S;
try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=blank()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar. Usa "Guardar copia".')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2500)}
const TABS=[['inicio','Inicio'],['tareas','Tareas'],['horario','Horario'],['examenes','Exámenes'],['apuntes','Apuntes'],['tarjetas','Tarjetas'],['pomo','Pomodoro']];
let tab='inicio',noteId=null,cardIdx=0,showBack=false,filt='pend';
const days=['Lunes','Martes','Miércoles','Jueves','Viernes'];
const hours=['8:00','9:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00'];

function boot(){
  document.documentElement.dataset.theme=S.theme||'';
  if(!S.user){$('#reg').classList.remove('hidden');$('#app').classList.add('hidden');return}
  $('#reg').classList.add('hidden');$('#app').classList.remove('hidden');
  mark();$('#uname').textContent=S.user.name;$('#uschool').textContent=S.user.school;
  document.title=S.user.name+' · Estudio';
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===tab?'on':''}">${l}</button>`).join('');
  render();
}
$('#regForm').onsubmit=e=>{e.preventDefault();S.user={name:$('#rn').value.trim(),school:$('#rs').value.trim()};save();boot();if(aroa()){fx(H,1000);toast('Hola Aroa 💖')}};
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;boot()}};
$('#bOut').onclick=()=>{$('#rn').value=S.user.name;$('#rs').value=S.user.school;S.user=null;boot()};
$('#bExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='copia-estudio-'+today()+'.json';a.click()};
$('#bImp').onclick=()=>$('#fImp').click();
$('#fImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(blank(),JSON.parse(r.result));save();boot();toast('Copia cargada')}catch(x){toast('Archivo no válido')}};r.readAsText(f)};

function render(){({inicio,tareas,horario,examenes,apuntes,tarjetas,pomo})[tab]()}
const V=h=>$('#view').innerHTML=h;
const daysTo=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);

/* INICIO */
function inicio(){
  const pend=S.tasks.filter(t=>!t.done),tot=S.tasks.length,pct=tot?Math.round(100*(tot-pend.length)/tot):0;
  const ex=S.exams.filter(e=>daysTo(e.date)>=0).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const pm=(S.pomo[today()]||0);
  const xp=S.tasks.filter(t=>t.done).length*10+Object.values(S.pomo).reduce((a,b)=>a+b,0)*20,lvl=Math.floor(xp/100)+1;
  const Q=QS[Math.floor(Date.now()/864e5)%QS.length];
  const wk=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const n=S.pomo[d.toISOString().slice(0,10)]||0;return `<div><i style="height:${Math.min(n*12,70)}px"></i>${'DLMXJVS'[d.getDay()]}</div>`}).join('');
  const di=new Date().getDay()-1,hoy=di>=0&&di<5?hours.map((h,i)=>[h,S.sched[di+'-'+i]]).filter(x=>x[1]):[];
  V(`<h2>Hola, ${esc(S.user.name)} 👋</h2><blockquote class="quote">${Q}</blockquote><div class="grid">
  <div class="card"><div class="mut">Tareas pendientes</div><div class="big">${pend.length}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="mut">${pct}% completado</div></div>
  <div class="card"><div class="mut">Próximo examen</div>${ex?`<div class="big">${daysTo(ex.date)===0?'Hoy':daysTo(ex.date)+' d'}</div><div>${esc(ex.subject)}</div>`:'<div class="mut" style="margin-top:.6rem">Sin exámenes. Añade uno en Exámenes.</div>'}</div>
  <div class="card"><div class="mut">Pomodoros hoy</div><div class="big">${pm}</div><div class="mut">${pm*25} min de enfoque</div></div>
  <div class="card"><div class="mut">Racha de estudio</div><div class="big">🔥 ${streak()}</div><div class="mut">días seguidos</div></div>
  <div class="card"><div class="mut">Nivel ${lvl}</div><div class="big">${xp} XP</div><div class="bar"><i style="width:${xp%100}%"></i></div><div class="mut">Tareas y pomodoros suman puntos</div></div></div>
  <div class="card" style="margin-top:1rem"><h3>Pomodoros de la semana</h3><div class="chart">${wk}</div></div>
  <div class="grid" style="margin-top:1rem">
  <div class="card"><h3>Hoy en clase</h3>${hoy.length?hoy.map(x=>`<div class="item"><span class="tag">${x[0]}</span><b>${esc(x[1])}</b></div>`).join(''):'<p class="mut">Nada en tu horario para hoy.</p>'}</div>
  <div class="card"><h3>Lo más urgente</h3>${pend.sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).slice(0,4).map(t=>`<div class="item"><div class="t"><b>${esc(t.text)}</b><div class="mut">${esc(t.subject||'')} ${t.due?'· '+t.due:''}</div></div></div>`).join('')||'<p class="mut">Todo al día. Buen trabajo.</p>'}</div></div>`);
}

/* TAREAS */
function tareas(){
  let l=S.tasks.filter(t=>filt==='all'||(filt==='pend')===!t.done);
  const ord={alta:0,media:1,baja:2};
  l.sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')||ord[a.prio]-ord[b.prio]);
  V(`<h2>Tareas</h2><div class="card stack"><form class="row" id="tf">
  <div style="flex:3 1 220px"><label>Tarea</label><input id="tt" required></div>
  <div><label>Asignatura</label><input id="ts"></div>
  <div><label>Fecha límite</label><input type="date" id="td"></div>
  <div><label>Prioridad</label><select id="tp"><option value="media">Media</option><option value="alta">Alta</option><option value="baja">Baja</option></select></div>
  <button class="btn">Añadir</button></form>
  <div class="row" style="align-items:center">${[['pend','Pendientes'],['done','Hechas'],['all','Todas']].map(([k,n])=>`<button class="btn sm ${filt===k?'':'ghost'}" data-f="${k}">${n}</button>`).join('')}</div>
  <div>${l.map(t=>`<div class="item ${t.done?'done':''}"><input type="checkbox" data-c="${t.id}" ${t.done?'checked':''} aria-label="Hecha"><div class="t"><b>${esc(t.text)}</b><div class="mut">${esc(t.subject||'')} ${t.due?'· '+t.due:''}</div></div><span class="tag ${t.prio}">${t.prio}</span><button class="x" data-d="${t.id}" aria-label="Borrar">×</button></div>`).join('')||'<p class="mut">No hay tareas aquí. Añade la primera arriba.</p>'}</div></div>`);
  $('#tf').onsubmit=e=>{e.preventDefault();S.tasks.push({id:uid(),text:$('#tt').value,subject:$('#ts').value,due:$('#td').value,prio:$('#tp').value,done:false});save();render()};
  $('#view').onclick=e=>{const c=e.target.dataset;
    if(c.f){filt=c.f;render()}
    if(c.d){S.tasks=S.tasks.filter(t=>t.id!==c.d);save();render()}};
  $('#view').onchange=e=>{const id=e.target.dataset.c;if(id){S.tasks.find(t=>t.id===id).done=e.target.checked;save();if(e.target.checked)fx(['🎉','✨','⭐'],500);render()}};
}

/* HORARIO */
function horario(){
  V(`<h2>Horario semanal</h2><div class="card hor"><table><tr><th></th>${days.map(d=>`<th>${d}</th>`).join('')}</tr>
  ${hours.map((h,i)=>`<tr><td class="h">${h}</td>${days.map((d,j)=>`<td><input data-s="${j}-${i}" value="${esc(S.sched[j+'-'+i]||'')}" aria-label="${d} ${h}"></td>`).join('')}</tr>`).join('')}</table></div><p class="mut">Escribe la asignatura en cada hora. Se guarda solo.</p>`);
  $('#view').oninput=e=>{const k=e.target.dataset.s;if(k){S.sched[k]=e.target.value;save()}};
}

/* EXÁMENES */
function examenes(){
  const g=S.exams.filter(e=>e.grade!==''&&e.grade!=null),avg=g.length?(g.reduce((a,e)=>a+ +e.grade,0)/g.length).toFixed(2):'–';
  V(`<h2>Exámenes y notas</h2><div class="grid"><div class="card stack"><h3>Añadir examen</h3><form class="stack" id="ef">
  <div><label>Asignatura</label><input id="es" required></div><div><label>Fecha</label><input type="date" id="ed" required></div>
  <div><label>Nota (si ya la tienes)</label><input type="number" step="0.01" min="0" max="10" id="eg"></div><button class="btn">Guardar</button></form>
  <div><div class="mut">Nota media</div><div class="big">${avg}</div></div></div>
  <div class="card"><h3>Calendario</h3>${[...S.exams].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{const d=daysTo(e.date);return `<div class="item"><div class="t"><b>${esc(e.subject)}</b><div class="mut">${e.date}${e.grade!==''&&e.grade!=null?' · Nota '+e.grade:''}</div></div><span class="tag ${d<0?'':d<=7?'alta':'media'}">${d<0?'pasado':d===0?'hoy':d+' días'}</span><button class="x" data-d="${e.id}" aria-label="Borrar">×</button></div>`}).join('')||'<p class="mut">Aún no has añadido exámenes.</p>'}</div></div>`);
  $('#ef').onsubmit=e=>{e.preventDefault();S.exams.push({id:uid(),subject:$('#es').value,date:$('#ed').value,grade:$('#eg').value});save();render()};
  $('#view').onclick=e=>{const d=e.target.dataset.d;if(d){S.exams=S.exams.filter(x=>x.id!==d);save();render()}};
}

/* APUNTES */
function apuntes(){
  if(!noteId&&S.notes[0])noteId=S.notes[0].id;
  const n=S.notes.find(x=>x.id===noteId);
  V(`<h2>Apuntes</h2><div class="notes"><div class="card nl"><button class="btn sm" id="nn" style="margin-bottom:.5rem;width:100%;text-align:center">+ Nuevo apunte</button>${S.notes.map(x=>`<button data-n="${x.id}" class="${x.id===noteId?'on':''}">${esc(x.title||'Sin título')}</button>`).join('')}</div>
  <div class="card stack">${n?`<input id="nt" value="${esc(n.title)}" placeholder="Título" style="font-weight:700"><textarea id="nb" placeholder="Escribe tus apuntes...">${esc(n.body)}</textarea><button class="btn sm ghost" id="nd" style="justify-self:start">Borrar apunte</button>`:'<p class="mut">Crea tu primer apunte con el botón de la izquierda.</p>'}</div></div>`);
  $('#nn').onclick=()=>{const x={id:uid(),title:'',body:''};S.notes.unshift(x);noteId=x.id;save();render()};
  $('#view').onclick=e=>{const id=e.target.dataset.n;if(id){noteId=id;render()}};
  if(n){$('#nt').oninput=e=>{n.title=e.target.value;save()};$('#nb').oninput=e=>{n.body=e.target.value;save()};
    $('#nd').onclick=()=>{if(confirm('¿Borrar este apunte?')){S.notes=S.notes.filter(x=>x!==n);noteId=null;save();render()}}}
}

/* TARJETAS */
function tarjetas(){
  const c=S.cards[cardIdx%Math.max(S.cards.length,1)];
  V(`<h2>Tarjetas de estudio</h2><div class="grid"><div class="card stack"><h3>Nueva tarjeta</h3><form class="stack" id="cf"><div><label>Pregunta</label><input id="cq" required></div><div><label>Respuesta</label><input id="ca" required></div><button class="btn">Añadir</button></form><p class="mut">${S.cards.length} tarjetas guardadas</p></div>
  <div class="card stack"><h3>Repasar</h3>${c?`<div class="flip" id="fl" tabindex="0">${esc(showBack?c.a:c.q)}</div><div class="mut" style="text-align:center">Toca la tarjeta para ver ${showBack?'la pregunta':'la respuesta'}</div><div class="center" style="margin:0"><button class="btn ghost sm" id="pv">Anterior</button><button class="btn sm" id="nx">Siguiente</button><button class="btn ghost sm" id="dc">Borrar</button></div>`:'<p class="mut">Añade tarjetas para empezar a repasar.</p>'}</div></div>`);
  $('#cf').onsubmit=e=>{e.preventDefault();S.cards.push({id:uid(),q:$('#cq').value,a:$('#ca').value});save();render()};
  if(c){const fl=()=>{showBack=!showBack;render()};$('#fl').onclick=fl;$('#fl').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fl()}};
    $('#nx').onclick=()=>{cardIdx=(cardIdx+1)%S.cards.length;showBack=false;render()};
    $('#pv').onclick=()=>{cardIdx=(cardIdx-1+S.cards.length)%S.cards.length;showBack=false;render()};
    $('#dc').onclick=()=>{S.cards=S.cards.filter(x=>x!==c);cardIdx=0;showBack=false;save();render()}}
}

/* POMODORO */
let pt=null,left=25*60,mode='foco';
function pomo(){
  const m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0');
  V(`<h2>Pomodoro</h2><div class="card"><div class="mut" style="text-align:center">${mode==='foco'?'Hora de concentrarte':'Descanso'}</div><div class="time" id="tm">${m}:${s}</div>
  <div class="center"><button class="btn" id="pg">${pt?'Pausar':'Empezar'}</button><button class="btn ghost" id="pr">Reiniciar</button><button class="btn ghost" id="p25">Foco 25</button><button class="btn ghost" id="p50">Foco 50</button><button class="btn ghost" id="p5">Descanso 5</button></div>
  <p class="mut" style="text-align:center;margin-top:1rem">Hoy: ${S.pomo[today()]||0} sesiones completadas</p></div>`);
  $('#pg').onclick=()=>{if(pt){clearInterval(pt);pt=null;pomo()}else{pt=setInterval(tick,1000);pomo()}};
  $('#pr').onclick=()=>{clearInterval(pt);pt=null;left=mode==='foco'?1500:300;pomo()};
  $('#p25').onclick=()=>{clearInterval(pt);pt=null;mode='foco';left=1500;pomo()};
  $('#p50').onclick=()=>{clearInterval(pt);pt=null;mode='foco';left=3000;pomo()};
  $('#p5').onclick=()=>{clearInterval(pt);pt=null;mode='descanso';left=300;pomo()};
}
function tick(){
  left--;const t=$('#tm');document.title=Math.floor(left/60)+':'+String(left%60).padStart(2,'0')+' · Estudio';
  if(t)t.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
  if(left<=0){clearInterval(pt);pt=null;if(mode==='foco'){S.pomo[today()]=(S.pomo[today()]||0)+1;save();mode='descanso';left=300}else{mode='foco';left=1500}
    toast('¡Tiempo! Cambia de fase.');beep();fx(['🍅','✨'],800);if(tab==='pomo')pomo()}
}
const QS=['Un pequeño paso cada día supera a un gran esfuerzo un solo día.','No tienes que ser perfecto, solo constante.','Estudiar hoy es regalarle tiempo a tu yo del futuro.','Empieza ahora: la motivación llega después.','Lo difícil de hoy será fácil mañana.','Descansar también es parte de estudiar.','Cada tarjeta repasada es un punto ganado.'];
const H=['❤️','💖','💗','💕'];
const aroa=()=>/^\s*aroa\s*$/i.test((S.user&&S.user.name)||'');
function fx(em,ms){const n=Math.round(ms/25);for(let i=0;i<n;i++)setTimeout(()=>{const s=document.createElement('span');s.className='fx';s.textContent=em[i%em.length];s.style.left=Math.random()*100+'vw';s.style.fontSize=(1+Math.random()*1.6)+'rem';s.style.animationDuration=(.8+Math.random()*.4)+'s';document.body.append(s);setTimeout(()=>s.remove(),1300)},i*25)}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.4)}catch(e){}}
function mark(){S.days=S.days||[];if(!S.days.includes(today())){S.days.push(today());save()}}
function streak(){let n=0,d=new Date();const x=new Set(S.days||[]);if(!x.has(today()))d.setDate(d.getDate()-1);while(x.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
$('#bTh').onclick=()=>{const dk=document.documentElement.dataset.theme==='dark'||(!S.theme&&matchMedia('(prefers-color-scheme:dark)').matches);S.theme=dk?'light':'dark';save();boot()};
$('#rn').oninput=e=>{if(/^\s*aroa\s*$/i.test(e.target.value))fx(H,1000)};
boot();if(aroa())setTimeout(()=>fx(H,1000),300);
</script>
</body>
</html>
